name: Producción

# El lanzamiento (fase 11): publica en la producción de Cloudflare Pages (la rama `main` del proyecto,
# servida en el dominio propio, tierra-luna-sol.ivanchesa.com) el build que ya verificó el CI para ese
# commit (D26): no se vuelve a construir, se baja el artefacto `build` de su ejecución. Con una etiqueta
# `v*` (`git tag -a v1.0.0 -m … && git push origin v1.0.0`) o a mano (Actions → Producción → Run
# workflow, eligiendo la etiqueta). El CI tiene que haber pasado entero en ese commit con un push a una
# rama (el de `main`, normalmente); si aún está en marcha, se espera a que termine. Solo desde una
# etiqueta `v*` (a mano, también: el formulario trae `main` por defecto y eso no se publica). Su
# artefacto dura 7 días: para volver a una versión más antigua, «Rollback» en el panel de Pages (relanzar
# su CI también vuelve a publicar ese build en su vista previa, en `staging` si es de `main`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue de producción cada vez, sin cancelar el que está en marcha.
concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: Producción en Cloudflare Pages
    # Solo una etiqueta de versión llega a producción (también a mano: hay que elegir la etiqueta).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Leer el repositorio y las ejecuciones del CI (para bajar su artefacto); los secrets de Cloudflare,
    # solo en el paso de wrangler.
    permissions:
      contents: read
      actions: read
    env:
      WRANGLER_VERSION: '4.149.0'
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario), las mismas que en ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # El dominio, de su único sitio (`site.config.ts`).
      - name: El dominio
        id: site
        run: |
          url=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e \
            "const { SITE_CONFIG } = await import('./src/app/core/site.config.ts'); console.log(SITE_CONFIG.baseUrl)")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # El commit de la etiqueta (con una etiqueta anotada, el commit al que apunta, no la etiqueta) y la
      # ejecución del CI de ese commit, que tiene que acabar en verde.
      - name: El CI de este commit, en verde
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 90); do
            # Un fallo pasajero de la API no corta la espera: se vuelve a mirar a los 30 s.
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --event push \
              --limit 1 --json databaseId,status,conclusion,headBranch --jq '.[0] // empty') ||
              { echo "::warning::gh run list ha fallado; otra mirada en 30 s"; run=''; }
            if [[ -n "$run" ]]; then
              id=$(jq -r .databaseId <<< "$run")
              status=$(jq -r .status <<< "$run")
              conclusion=$(jq -r .conclusion <<< "$run")
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "::error::El CI de $sha (ejecución $id) acabó en «$conclusion»: no se publica"
                  exit 1
                fi
                echo "run-id=$id" >> "$GITHUB_OUTPUT"
                echo "CI de $sha en verde: ejecución $id ($(jq -r .headBranch <<< "$run"))"
                exit 0
              fi
              echo "El CI de $sha (ejecución $id) sigue en marcha ($status); otra mirada en 30 s"
            else
              echo "Aún no hay ejecución del CI para $sha; otra mirada en 30 s"
            fi
            sleep 30
          done
          echo "::error::El CI de $sha no ha terminado en 45 min: cuando acabe en verde, relanza Producción desde la etiqueta"
          exit 1

      # El build verificado: el mismo que probaron los e2e del CI.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}

      # `--branch=main`: la rama de producción del proyecto de Pages (el CI publica `main` como
      # «staging», ci.yml). Sin builds de Cloudflare (D26).
      - name: Despliega en producción
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy build/browser --project-name=tierra-luna-sol --branch=main --commit-hash=${{ steps.ci.outputs.sha }}

      - name: Direcciones
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ steps.ci.outputs.run-id }}
          SITE_URL: ${{ steps.site.outputs.url }}
        run: |
          {
            echo "### Cloudflare Pages ($ENVIRONMENT)"
            echo "- Versión: \`$REF\` (build del CI, ejecución $RUN_ID)"
            echo "- Este despliegue: $URL"
            echo "- El sitio: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # La publicación, comprobada en sus tres direcciones (scripts/verify-pages.mjs): la del despliegue y
      # la de producción en pages.dev (cada una con su regla de noindex en `_headers`) y el dominio propio
      # (sin X-Robots-Tag ni NEL, con el sitemap), con el HTML servido idéntico al del build. Con
      # reintentos: las direcciones tardan unos segundos en cambiar.
      - name: Comprueba la publicación
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          SITE_URL: ${{ steps.site.outputs.url }}
        run: |
          for target in "$URL" https://tierra-luna-sol.pages.dev "$SITE_URL"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-pages.mjs "$target" --build build/browser; then
                ok=1
                break
              fi
              echo "Intento $attempt sin éxito en $target; otro en 30 s"
              sleep 30
            done
            [[ $ok == 1 ]] || exit 1
          done
