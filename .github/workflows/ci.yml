name: CI

# En cada push (todas las ramas: cada una tiene su vista previa en Cloudflare Pages) y en los pull
# requests. Las ramas de Dependabot pasan solo por su pull request: no se despliegan.
on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      # En la hora de Madrid, como en el equipo de Iván: así también corren los tests del cambio de
      # horario y de los límites en hora local (en UTC se saltan).
      - run: npm test
        env:
          TZ: Europe/Madrid
      # El build ya preparado para Cloudflare Pages (scripts/prepare-pages.mjs).
      - run: npm run build
      - run: node scripts/check-initial-bundle.mjs

      # El build verificado: lo prueban los e2e y es el que se despliega.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: dist/tierra-luna-sol/browser
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e (Chromium con SwiftShader)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist/tierra-luna-sol/browser

      - run: npx tsc -p tsconfig.e2e.json
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-trazas
          path: test-results
          retention-days: 7

  deploy:
    name: Vista previa en Cloudflare Pages
    # Solo con el CI en verde, en un push (no en los pull requests, que no tienen los secrets).
    needs: [check, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `main` se publica como «staging»: la producción (la rama `main` del proyecto) llega con la
      # etiqueta de la fase 11. Cada rama de fase, con su nombre.
      PAGES_BRANCH: ${{ github.ref_name == 'main' && 'staging' || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      - name: ¿Existe el proyecto de Pages?
        id: projects
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages project list

      - name: Crea el proyecto (solo la primera vez)
        if: ${{ !contains(steps.projects.outputs.command-output, 'tierra-luna-sol') }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages project create tierra-luna-sol --production-branch=main

      # El build del CI tal cual: sin builds de Cloudflare (D26).
      - name: Despliega
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages deploy build --project-name=tierra-luna-sol --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ github.sha }}

      - name: Direcciones
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          {
            echo "### Cloudflare Pages ($ENVIRONMENT)"
            echo "- Rama: \`$PAGES_BRANCH\`"
            echo "- Vista previa: $ALIAS"
            echo "- Este despliegue: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
