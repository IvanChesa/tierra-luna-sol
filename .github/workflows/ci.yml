name: CI

# En cada push (todas las ramas: cada una tiene su vista previa en Cloudflare Pages) y en los pull
# requests. Las ramas de Dependabot pasan solo por su pull request: no se despliegan. Un PR desde una
# rama de este repositorio pasa el CI dos veces (el push y el PR): hoy las fases se fusionan en local,
# sin PR, y se acepta.
on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      # En la hora de Madrid, como en el equipo de Iván: así también corren los tests del cambio de
      # horario y de los límites en hora local (en UTC se saltan).
      - run: npm test
        env:
          TZ: Europe/Madrid
      # El build ya preparado para Cloudflare Pages (scripts/prepare-pages.mjs).
      - run: npm run build
      - run: node scripts/check-initial-bundle.mjs
      # Sin enlaces rotos (fase 9): los internos y sus anclas, en el HTML del build.
      - run: node scripts/check-links.mjs

      # El build verificado: lo prueban los e2e (con la lista de rutas prerenderizadas, fuera de
      # browser/) y su browser/ es lo que se despliega. Sin ficheros ocultos: prepare-pages.mjs ya los
      # quita (Pages no los sirve), así que el artefacto es el build entero.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: dist/tierra-luna-sol
          include-hidden-files: false
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e (Chromium con SwiftShader)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist/tierra-luna-sol

      - run: npx tsc -p tsconfig.e2e.json
      # En el push que pide referencias nuevas, la regresión visual va en su trabajo, «referencias».
      - run: npx playwright test ${{ contains(github.event.head_commit.message, '[referencias]') && '--grep-invert @regresion' || '' }}

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-trazas
          path: test-results
          retention-days: 7

  # La regresión visual (fase 10, 10.h): sus referencias, de Linux (el Chromium de Playwright con
  # SwiftShader, como el trabajo e2e), en un push cuyo mensaje lleva «[referencias]». Salen como artefacto
  # del CI y se guardan en el repositorio con un commit normal (`e2e/regresion.spec.ts-snapshots/`): el
  # CI no escribe en el repositorio.
  referencias:
    name: Referencias de la regresión visual
    needs: check
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[referencias]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist/tierra-luna-sol

      - run: npx playwright test --grep @regresion --update-snapshots=all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: referencias
          path: e2e/regresion.spec.ts-snapshots
          retention-days: 7
          if-no-files-found: error

  # Lighthouse (fase 10, tarea 7; `@lhci/cli`, aprobado en la revisión del bloque S): los presupuestos
  # de §5 en el móvil de Lighthouse, con el build verificado y el Chromium de Playwright
  # (`lighthouserc.js`). Los informes, en el disco del CI (y como artefacto del CI, 7 días); nunca en
  # `temporary-public-storage`. No frena la vista previa. El rendimiento, como aviso (los ejecutores
  # gratuitos no dan cifras estables; las que cuentan, las de local y las de producción); la
  # accesibilidad y las buenas prácticas, como error: si bajan, el trabajo sale en rojo.
  lighthouse:
    name: Lighthouse (móvil)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist/tierra-luna-sol

      # Dos tandas (`LHCI_PAGES` en `lighthouserc.js`): las páginas de contenido, sin WebGL por
      # software, que no usan; y el explorador, con él. Después, las notas y los informes de las dos.
      - run: npx lhci collect
        env:
          LHCI_PAGES: contenido
      - run: npx lhci collect --additive
        env:
          LHCI_PAGES: explorador
      - run: npx lhci assert
      - if: always()
        run: npx lhci upload

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/informes
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Vista previa en Cloudflare Pages
    # Solo con el CI en verde, en un push (no en los pull requests, que no tienen los secrets).
    needs: [check, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Solo para leer el repositorio (el verificador); los secrets de Cloudflare, solo en los pasos de
    # wrangler.
    permissions:
      contents: read
    env:
      # `main` se publica como «staging»: la producción (la rama `main` del proyecto) llega con la
      # etiqueta de la fase 11. Cada rama de fase, con su nombre.
      PAGES_BRANCH: ${{ github.ref_name == 'main' && 'staging' || github.ref_name }}
      WRANGLER_VERSION: '4.149.0'
    steps:
      # El nombre llega a wrangler como argumento: solo minúsculas, cifras y guiones (los alias de Pages).
      - name: Nombre de la rama
        run: |
          if [[ ! "$PAGES_BRANCH" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::La rama «$PAGES_BRANCH» no vale como alias de Pages (solo [a-z0-9-])"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      - name: ¿Existe el proyecto de Pages?
        id: projects
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project list

      - name: Crea el proyecto (solo la primera vez)
        if: ${{ !contains(steps.projects.outputs.command-output, 'tierra-luna-sol') }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project create tierra-luna-sol --production-branch=main

      # El build del CI tal cual: sin builds de Cloudflare (D26).
      - name: Despliega
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy build/browser --project-name=tierra-luna-sol --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ github.sha }}

      - name: Direcciones
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          {
            echo "### Cloudflare Pages ($ENVIRONMENT)"
            echo "- Rama: \`$PAGES_BRANCH\`"
            echo "- Vista previa: $ALIAS"
            echo "- Este despliegue: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # La publicación, comprobada: rutas, redirecciones, 404, cabeceras, Early Hints, caché y que el
      # HTML servido es el del build (Cloudflare no inyecta nada). Con reintentos: el certificado de
      # un subdominio nuevo de pages.dev tarda unos minutos.
      - name: Comprueba la publicación
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-pages.mjs "$URL" --build build/browser; then
              exit 0
            fi
            echo "Intento $attempt sin éxito; otro en 30 s"
            sleep 30
          done
          exit 1
