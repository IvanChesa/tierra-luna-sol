<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="site-header">
  <a class="site-name" routerLink="/">{{ site.name }}</a>
  <nav aria-label="Principal">
    <ul>
      <li>
        <a routerLink="/planetas" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Planetas</a
        >
      </li>
      <li>
        <a routerLink="/sol" routerLinkActive="is-active" ariaCurrentWhenActive="page">Sol</a>
      </li>
      <li>
        <a routerLink="/luna" routerLinkActive="is-active" ariaCurrentWhenActive="page">Luna</a>
      </li>
      <li>
        <a routerLink="/sobre-el-proyecto" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Sobre el proyecto</a
        >
      </li>
    </ul>
  </nav>
</header>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <p>
    Un proyecto de <a [href]="site.author.url">{{ site.author.name }}</a> ·
    <a routerLink="/creditos">Créditos</a>
  </p>
</footer>
