<div class="stage">
  <tls-viewer-canvas [view]="view()" (ready)="sceneReady()" />
</div>

<!--
  Orden del foco: el lienzo, su cámara, la tarjeta del cuerpo elegido, el botón «Índice» y su panel,
  las fichas de cuerpos y la barra de tiempo (con reproducir y pausar en primer lugar).
-->
<tls-camera-controls class="camera" />

<!-- tabindex="-1": el foco llega aquí cuando la ficha tapa lo que lo tenía (la hoja del móvil). -->
<aside
  #panel
  class="panel"
  data-chrome
  tabindex="-1"
  [hidden]="!panelBody()"
  aria-label="Ficha del cuerpo elegido"
>
  @if (panelBody()) {
    <div
      class="panel__grip"
      aria-hidden="true"
      (pointerdown)="swipeDown($event)"
      (pointerup)="swipeEnd($event)"
      (pointercancel)="swipeEnd($event)"
    ></div>
  }
  <!-- Una ficha por cuerpo: al cambiar de cuerpo se crea otra y entra con un fundido. -->
  @for (id of panelBodies(); track id) {
    <tls-body-panel [bodyId]="id" (closed)="closePanel()" />
  }
</aside>

<!-- El índice: un botón que lo abre y lo cierra (patrón de divulgación) y el panel, justo detrás. -->
<button
  #indexToggle
  type="button"
  class="control index-toggle"
  [attr.aria-expanded]="explorer.indexOpen()"
  aria-controls="explorer-index"
  title="Índice de cuerpos (I)"
  (click)="toggleIndex()"
>
  <tls-icon name="list" />
  Índice
</button>

<tls-index-panel
  class="index-panel"
  [hidden]="!explorer.indexOpen()"
  (closed)="closeIndex()"
  (chosen)="chosenInIndex()"
/>

<tls-body-chips class="chips" />

<tls-time-controls class="dock" />

<tls-notices class="notices" />

@if (explorer.travelling() === 'view') {
  <button type="button" class="control skip" (click)="session.skipTravel()">
    <tls-icon name="skip" />
    Saltar el viaje
    <kbd>Esc</kbd>
  </button>
}

@if (explorer.cleanView()) {
  <button #restore type="button" class="control restore" (click)="session.setCleanView(false)">
    <tls-icon name="restore" />
    Mostrar la interfaz
    <kbd>Esc</kbd>
  </button>
}

<tls-shortcuts-dialog />

<p class="visually-hidden" aria-live="polite">{{ session.announcement() }}</p>
