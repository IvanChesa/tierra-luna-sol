<div class="menu">
  <div class="field">
    <label class="field__label" for="time-date">Fecha</label>
    <!-- Al abrir el panel, el foco entra aquí (time-controls.ts) y vuelve a su botón al cerrarlo. -->
    <input
      #date
      id="time-date"
      class="control"
      type="date"
      [min]="minDate()"
      [max]="maxDate()"
      required
      [value]="dateValue()"
      [attr.aria-invalid]="invalid()"
      [attr.aria-describedby]="invalid() ? 'time-error' : null"
      (focus)="startEditing(date, clock)"
      (blur)="stopEditing(date, clock)"
      (change)="changed(date, clock)"
      (keydown.enter)="confirm(date, clock)"
    />
  </div>

  <div class="field">
    <label class="field__label" for="time-clock">Hora</label>
    <input
      #clock
      id="time-clock"
      class="control"
      type="time"
      step="1"
      [value]="timeValue()"
      (focus)="startEditing(date, clock)"
      (blur)="stopEditing(date, clock)"
      (change)="changed(date, clock)"
      (keydown.enter)="confirm(date, clock)"
    />
  </div>

  <div class="field">
    <label class="field__label" for="time-zone">Zona</label>
    <select id="time-zone" class="control" (change)="changeZone($event)">
      <option value="local" [selected]="zone() === 'local'">{{ localZoneLabel() }}</option>
      <option value="utc" [selected]="zone() === 'utc'">UTC</option>
    </select>
  </div>

  <button type="button" class="control" title="Volver a ahora, en tiempo real (N)" (click)="now()">
    Ahora
  </button>

  @if (invalid()) {
    <p class="menu__wide menu__error" id="time-error" role="alert">
      Esa fecha no existe o se sale del rango: elige una entre 1900 y 2100.
    </p>
  }

  <!-- En móvil, la velocidad (en escritorio está en la barra). -->
  <div class="field menu__wide menu__speed">
    <label class="field__label" for="time-speed-menu">Velocidad</label>
    <div class="field__group">
      <select id="time-speed-menu" class="control" (change)="changeSpeed($event)">
        @for (step of speeds; track step.id) {
          <option [value]="step.id" [selected]="speedId() === step.id">{{ step.label }}</option>
        }
      </select>
      <button
        type="button"
        class="control control--icon"
        [attr.aria-pressed]="sim.reverse()"
        title="Hacia atrás (R)"
        (click)="sim.toggleReverse()"
      >
        <tls-icon name="reverse" />
        <span class="visually-hidden">Hacia atrás</span>
      </button>
    </div>
  </div>

  <div class="field">
    <label class="field__label" for="time-quality">Calidad</label>
    <select id="time-quality" class="control" (change)="changeQuality($event)">
      @for (option of qualities; track option.value) {
        <option [value]="option.value" [selected]="sim.quality() === option.value">
          {{ option.label }}
        </option>
      }
    </select>
  </div>

  <button
    type="button"
    class="control"
    title="Vista limpia: ocultar la interfaz (V)"
    (click)="cleanView()"
  >
    <tls-icon name="clean" />
    Vista limpia
  </button>

  <button
    type="button"
    class="control menu__wide"
    aria-haspopup="dialog"
    title="Atajos de teclado (?)"
    (click)="openHelp()"
  >
    <tls-icon name="help" />
    Atajos de teclado
  </button>

  <!-- En móvil no hay pie: la fuente de los datos va aquí. -->
  <p class="menu__wide menu__source">1900–2100 · NASA/JPL · astronomy-engine</p>
</div>
