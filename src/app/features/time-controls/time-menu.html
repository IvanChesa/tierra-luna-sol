<!-- Como las hojas del índice y de la ficha: su título y un botón para cerrarlo. -->
<header class="menu__head">
  <h2 class="menu__title" id="time-menu-title">Controles</h2>
  <button
    type="button"
    class="menu__close"
    aria-label="Cerrar los controles"
    title="Cerrar los controles (Esc)"
    (click)="done.emit()"
  >
    <tls-icon name="close" />
  </button>
</header>

<div class="menu">
  <!-- El tiempo: la fecha, la hora y la zona, «Ahora», la velocidad (en el móvil) y el sentido. -->
  <div class="field">
    <label class="field__label" for="time-date">Fecha</label>
    <input
      #date
      id="time-date"
      class="control"
      type="date"
      [min]="minDate()"
      [max]="maxDate()"
      required
      [value]="dateValue()"
      [attr.aria-invalid]="invalid()"
      [attr.aria-describedby]="invalid() ? 'time-error' : null"
      (focus)="startEditing(date, clock)"
      (blur)="stopEditing(date, clock)"
      (change)="changed(date, clock)"
      (keydown.enter)="confirm(date, clock)"
    />
  </div>

  <div class="field">
    <label class="field__label" for="time-clock">Hora</label>
    <input
      #clock
      id="time-clock"
      class="control"
      type="time"
      step="1"
      [value]="timeValue()"
      (focus)="startEditing(date, clock)"
      (blur)="stopEditing(date, clock)"
      (change)="changed(date, clock)"
      (keydown.enter)="confirm(date, clock)"
    />
  </div>

  <div class="field">
    <label class="field__label" for="time-zone">Zona</label>
    <select id="time-zone" class="control" (change)="changeZone($event)">
      <option value="local" [selected]="zone() === 'local'">{{ localZoneLabel() }}</option>
      <option value="utc" [selected]="zone() === 'utc'">UTC</option>
    </select>
  </div>

  <button type="button" class="control" title="Volver a ahora, en tiempo real (N)" (click)="now()">
    Ahora
  </button>

  @if (invalid()) {
    <p class="menu__wide menu__error" id="time-error" role="alert">
      Esa fecha no existe o se sale del rango: elige una entre 1900 y 2100.
    </p>
  }

  <!-- En el móvil, la velocidad (en escritorio está en la barra). -->
  <div class="field menu__speed">
    <label class="field__label" for="time-speed-menu">Velocidad</label>
    <select id="time-speed-menu" class="control" (change)="changeSpeed($event)">
      @for (step of speeds; track step.id) {
        <option [value]="step.id" [selected]="speedId() === step.id">{{ step.label }}</option>
      }
    </select>
  </div>

  <!-- El sentido, con su nombre a la vista (el icono ⇆ no se confunde con los chevrones). -->
  <button
    type="button"
    class="control menu__reverse"
    [attr.aria-pressed]="sim.reverse()"
    title="Hacia atrás (R)"
    (click)="sim.toggleReverse()"
  >
    <tls-icon name="reverse" />
    Hacia atrás
  </button>

  <!-- La cámara: acercar y alejar (en el móvil no están sobre el 3D), la vista general y la limpia. -->
  <h3 class="menu__group menu__wide">Cámara</h3>
  <button type="button" class="control menu__zoom" title="Acercar (+)" (click)="zoom(1 / step)">
    <tls-icon name="plus" />
    Acercar
  </button>
  <button type="button" class="control menu__zoom" title="Alejar (−)" (click)="zoom(step)">
    <tls-icon name="minus" />
    Alejar
  </button>
  <button type="button" class="control" title="Vista general (G)" (click)="overview()">
    <tls-icon name="overview" />
    Vista general
  </button>
  <button
    type="button"
    class="control"
    title="Vista limpia: ocultar la interfaz (V)"
    (click)="cleanView()"
  >
    <tls-icon name="clean" />
    Vista limpia
  </button>

  <h3 class="menu__group menu__wide">Escena</h3>
  <div class="field">
    <label class="field__label" for="time-quality">Calidad</label>
    <select id="time-quality" class="control" (change)="changeQuality($event)">
      @for (option of qualities; track option.value) {
        <option [value]="option.value" [selected]="sim.quality() === option.value">
          {{ option.label }}
        </option>
      }
    </select>
  </div>

  <div class="field">
    <label class="field__label" for="time-scale">Escala</label>
    <select id="time-scale" class="control" (change)="changeScale($event)">
      @for (option of scales; track option.value) {
        <option [value]="option.value" [selected]="sim.scaleFrame() === option.value">
          {{ option.label }}
        </option>
      }
    </select>
  </div>

  <!-- El recorrido de la portada, cuando se quiera (fase 9c, 9c.6). -->
  <button type="button" class="control menu__wide" (click)="tour()">
    <tls-icon name="play" />
    Ver el recorrido
  </button>

  <!-- Sin teclado físico (el móvil), los atajos no sirven: no se ofrecen. -->
  <button
    type="button"
    class="control menu__wide menu__help"
    aria-haspopup="dialog"
    title="Atajos de teclado (?)"
    (click)="openHelp()"
  >
    <tls-icon name="help" />
    Atajos de teclado
  </button>

  <p class="menu__wide menu__source">1900–2100 · NASA/JPL · astronomy-engine</p>
</div>
