<section class="time" aria-label="Tiempo de la simulación">
  <!-- Lo primero y más visible de la barra (WCAG 2.2.2): el sistema arranca en movimiento (D31). -->
  <button type="button" class="time__play" [title]="playLabel() + ' (K)'" (click)="togglePlaying()">
    <tls-icon [name]="sim.playing() ? 'pause' : 'play'" />
    <span class="visually-hidden">{{ playLabel() }}</span>
  </button>

  <!-- En móvil, sin caja: la lectura y el calendario van a la primera fila de la barra. -->
  <div class="time__date">
    <!-- Siempre tres líneas (no cambia de alto al reproducir): en escritorio, el rótulo, la fecha y
         la zona; en móvil, la fecha, la zona y la velocidad (su selector está en «Controles +»). -->
    <p class="time__readout">
      <span class="time__label">Fecha</span>
      <time [attr.datetime]="sim.time().toISOString()">{{ readout() }}</time>
      <span class="time__zone">{{ zoneText() }}</span>
      <span class="time__speedtext">{{ speedText() }}</span>
    </p>
    <!--
      El calendario nativo: el botón lo abre sobre un campo de fecha que no se ve ni recibe el foco
      (para escribir la fecha está el de «Controles +»).
    -->
    <span class="time__calendar">
      <button
        type="button"
        class="control control--icon"
        title="Elegir la fecha en el calendario"
        (click)="openCalendar(picker)"
      >
        <tls-icon name="calendar" />
        <span class="visually-hidden">Elegir la fecha en el calendario</span>
      </button>
      <input
        #picker
        class="time__picker"
        type="date"
        tabindex="-1"
        aria-hidden="true"
        [min]="minDate()"
        [max]="maxDate()"
        [value]="dateValue()"
        (change)="pickDate(picker)"
      />
    </span>
  </div>

  <tls-timeline class="time__line" [zone]="zone()" />

  <div class="field time__speed">
    <label class="field__label" for="time-speed">Velocidad</label>
    <div class="field__group">
      <select id="time-speed" class="control" (change)="changeSpeed($event)">
        @for (step of speeds; track step.id) {
          <option [value]="step.id" [selected]="speedId() === step.id">{{ step.label }}</option>
        }
      </select>
      <button
        type="button"
        class="control control--icon"
        [attr.aria-pressed]="sim.reverse()"
        title="Hacia atrás (R)"
        (click)="toggleReverse()"
      >
        <tls-icon name="reverse" />
        <span class="visually-hidden">Hacia atrás</span>
      </button>
    </div>
  </div>

  <!-- «Controles +»; en los teléfonos estrechos, solo su icono (distinto del «+» de la cámara). -->
  <button
    #more
    type="button"
    class="control time__more"
    popovertarget="time-menu"
    title="Controles: fecha, hora, calidad y atajos"
    [attr.aria-expanded]="menuOpen()"
    (pointerdown)="pressMore(true)"
    (click)="pressMore(false)"
  >
    <span class="time__more-label">Controles</span>
    <tls-icon class="time__more-sign" [name]="menuOpen() ? 'minus' : 'plus'" />
    <tls-icon class="time__more-icon" name="sliders" />
  </button>
  <tls-time-menu
    id="time-menu"
    popover
    role="group"
    aria-labelledby="time-menu-title"
    [(zone)]="zone"
    (done)="closeMenu()"
    (toggle)="onMenuToggle($event)"
    (focusout)="onMenuFocusOut($event)"
  />
</section>
