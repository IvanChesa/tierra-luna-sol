<section
  class="explorer"
  [class.explorer--sky]="view() === 'sky'"
  [class.explorer--detail]="view() === 'earth' || view() === 'moon'"
  aria-label="Explorador"
>
  @if (!posterGone()) {
    <tls-viewer-poster class="explorer__poster" [view]="view()" />
  }

  <!--
    Fondo de la barra de tiempo, con un fundido corto encima (fase 9c: las fichas de cuerpos flotan sobre
    el 3D). Reserva su sitio desde el HTML prerenderizado: cuando llega la interfaz, nada se mueve. Su
    alto cuenta en el margen de abajo del encuadre (data-chrome).
  -->
  <div class="explorer__dock" data-chrome></div>

  <!-- Arriba a la izquierda, flotando sobre el 3D: las vistas y el texto de presentación. -->
  <div class="explorer__lead" data-chrome>
    <tls-view-switcher [view]="view()" />
    <div class="explorer__intro">
      <router-outlet (activate)="onActivate()" />
    </div>
    <!--
      La autoría (fase 9c, decisión 3 de Iván): discreta, en la primera pantalla, la de la portada; se
      pliega con la entradilla.
    -->
    @if (view() === 'system') {
      <p class="explorer__credit">
        {{ authorship.text }} Un proyecto de {{ site.author.name }} ·
        <a [routerLink]="authorship.source.path" [fragment]="authorship.source.fragment"
          >Cómo se calcula</a
        >
      </p>
    }
  </div>

  <!--
    Las pistas de uso de la primera vez, junto a la fila de fichas, las enseña la interfaz (crítica de
    la 9c). Los créditos, lo legal y la nota de privacidad, en el menú del sitio; la fuente de los
    datos, en «Controles».
  -->
  <!--
    La interfaz y el 3D llegan cuando el navegador queda libre, y como muy tarde a los 3 s (el
    `timeout` de requestIdleCallback): con el hilo principal ocupado sin pausa (en el CI, con
    SwiftShader y dos workers), la llamada de idle podía no llegar nunca y el explorador no cargaba
    (cierre de la fase 9b: la traza de un e2e del CI, sin pedir el chunk en 90 s).
  -->
  @defer (on idle(3s)) {
    <tls-explorer-ui [view]="view()" (ready)="onReady()" />
  }
</section>
