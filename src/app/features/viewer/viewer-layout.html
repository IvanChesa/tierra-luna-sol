<section class="explorer" aria-label="Explorador">
  @if (!posterGone()) {
    <tls-viewer-poster class="explorer__poster" [view]="view()" />
  }

  <!--
    Fondo de la franja de abajo (fichas de cuerpos, barra de tiempo y pie). Reserva su sitio desde el
    HTML prerenderizado: cuando llega la interfaz, nada se mueve. Su alto es el margen de abajo del
    encuadre (data-chrome).
  -->
  <div class="explorer__dock" data-chrome></div>

  <!-- Arriba a la izquierda, flotando sobre el 3D: las vistas y el texto de presentación. -->
  <div class="explorer__lead" data-chrome>
    <tls-view-switcher [view]="view()" />
    <div class="explorer__intro">
      <router-outlet (activate)="onActivate()" />
    </div>
    <p class="explorer__touch">Arrastra para girar · pellizca para acercarte</p>
  </div>

  @defer (on idle) {
    <tls-explorer-ui [view]="view()" (ready)="onReady()" />
  }

  <!-- Al final del DOM (el foco llega después de la interfaz), en letra pequeña al pie. -->
  <footer class="explorer__foot">
    <p class="explorer__hints">
      Arrastra para girar · usa la rueda o pellizca para acercarte · elige un cuerpo
    </p>
    <p class="explorer__credits">
      <span>1900–2100 · NASA/JPL · astronomy-engine</span>
      <span>
        Un proyecto de <a [href]="site.author.url">{{ site.author.name }}</a> ·
        <a routerLink="/creditos">Créditos</a>
      </span>
    </p>
  </footer>
</section>
